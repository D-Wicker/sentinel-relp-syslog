# ==============================================================
# relp-client.conf — Envoi de logs via RELP avec mTLS
# Rôle : cette VM cliente capte ses logs locaux (imuxsock) et les
# envoie chiffrés/authentifiés vers LOG-FRONT-01:6514 (serveur RELP).
# A adapter : remplacer __CN__ par le hostname exact de la machine
# (doit correspondre au CN utilisé lors de generate-client-cert.sh).
# ==============================================================

# imuxsock n'est PAS rechargé ici : ce module est déjà déclaré dans
# la conf système par défaut (/etc/rsyslog.conf) sur toute
# installation Debian standard. rsyslog interdit de charger deux
# fois le même module — les logs locaux sont donc déjà captés sans
# qu'on ait besoin de le redéclarer dans ce fichier dédié RELP.

module(load="omrelp" tls.tlslib="openssl")
# Charge le module de SORTIE RELP (om = Output Module, à l'inverse
# d'imrelp = Input Module côté serveur). Force la bibliothèque
# OpenSSL pour le TLS, cohérence avec le serveur.

action(
    type="omrelp"
    target="172.16.1.18"
    port="6514"

    # --- Paramètres TLS (mTLS) ---
    tls="on"
    tls.cacert="/etc/rsyslog.d/certs/ca-cert.pem"
    # Certificat de la CA : permet au client de vérifier que le
    # serveur auquel il se connecte est bien légitime (partie
    # "authentification du serveur" du mTLS, côté client cette fois).

    tls.mycert="/etc/rsyslog.d/certs/__CN__-cert.pem"
    tls.myprivkey="/etc/rsyslog.d/certs/__CN__-key.pem"
    # Certificat et clé privée DE CETTE machine cliente, présentés
    # au serveur pour prouver son identité (partie "authentification
    # du client" du mTLS). Signés par la même CA que le serveur.

    tls.authmode="certvalid"
    # Exige que le certificat présenté par le serveur soit lui-même
    # valide et signé par cette CA-  vérification symétrique à celle
    # que le serveur applique au client.
)
