# ==============================================================
# relp-server.conf — Réception de logs via RELP avec mTLS
# Rôle : LOG-FRONT-01 agit comme serveur RELP, authentifiant
# chaque client par certificat (mTLS) avant d'accepter ses logs.
# Ce flux est isolé du flux imtcp existant (port 514, en clair).
# ==============================================================

module(load="imrelp" tls.tlslib="openssl")

# Le template est déclaré au niveau global (obligatoire en
# RainerScript : template() ne peut pas être imbriqué dans un
# bloc ruleset(), seules les actions/instructions le peuvent).
template(name="RelpRemoteLogs" type="string" string="/var/log/remote-relp/%HOSTNAME%.log")

# Le ruleset isole le traitement : seuls les messages reçus par
# CETTE input RELP passeront par ce ruleset et ce template.
# Les messages locaux, imtcp, imklog etc. n'y sont jamais soumis.
ruleset(name="relp_in") {
    *.* ?RelpRemoteLogs
    stop
}

input(
    type="imrelp"
    port="6514"
    ruleset="relp_in"

    tls="on"
    tls.cacert="/etc/rsyslog.d/certs/ca-cert.pem"
    tls.mycert="/etc/rsyslog.d/certs/server-cert.pem"
    tls.myprivkey="/etc/rsyslog.d/certs/server-key.pem"
    tls.authmode="certvalid"
)